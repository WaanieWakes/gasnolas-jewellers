// State
const STORAGE_KEY = "jewelry_kanban_state_v1";
function defaultState() {
  const cols = {}; COLUMNS.forEach(c=>cols[c]=[]);
  CARDS.forEach(c => { cols[c[5]].push(c[0]); });
  return { columns: cols };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      // validate
      if (s && s.columns) {
        // ensure all cards present
        const present = new Set();
        COLUMNS.forEach(c => (s.columns[c]||[]).forEach(id=>present.add(id)));
        CARDS.forEach(c => { if(!present.has(c[0])) { (s.columns[c[5]]||s.columns["Backlog"]).push(c[0]); } });
        // remove unknown
        COLUMNS.forEach(c => { s.columns[c] = (s.columns[c]||[]).filter(id=>CARDS.some(x=>x[0]===id)); });
        return s;
      }
    }
  } catch(e){}
  return defaultState();
}
let state = loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

const cardMap = Object.fromEntries(CARDS.map(c=>[c[0],c]));

// Build UI
const board = document.getElementById("board");
const colEls = {};
COLUMNS.forEach(col => {
  const el = document.createElement("div");
  el.className = "column";
  el.dataset.col = col;
  el.innerHTML = `<div class="column-header"><h2>${col}</h2><span class="count" id="count-${col}">0</span></div><div class="card-list" data-col="${col}"></div>`;
  board.appendChild(el);
  colEls[col] = el.querySelector(".card-list");
});

// track filter
const trackFilter = document.getElementById("trackFilter");
Object.keys(TRACKS).forEach(t => {
  const opt = document.createElement("option"); opt.value = t; opt.textContent = t; trackFilter.appendChild(opt);
});

function visible(card) {
  const f = trackFilter.value;
  if (f === "all") return true;
  return card[3] === f;
}

function render() {
  COLUMNS.forEach(col => {
    const list = colEls[col];
    list.innerHTML = "";
    (state.columns[col]||[]).forEach(id => {
      const c = cardMap[id];
      if (!c) return;
      if (!visible(c)) return;
      const el = document.createElement("div");
      el.className = "card";
      el.draggable = true;
      el.dataset.id = id;
      el.style.borderLeftColor = TRACKS[c[3]].color;
      el.innerHTML = `
        <div class="card-title">${c[1]}</div>
        <div class="card-desc">${c[2]}</div>
        <div class="card-meta">
          <span class="track-dot" style="background:${TRACKS[c[3]].color}"></span>
          <span class="tag">${c[3]}</span>
          <span class="priority p-${c[4]}">${c[4]}</span>
        </div>`;
      // drag events
      el.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", id);
        el.classList.add("dragging");
      });
      el.addEventListener("dragend", () => el.classList.remove("dragging"));
      list.appendChild(el);
    });
  });
  updateCounts();
  updateProgress();
}

function updateCounts() {
  COLUMNS.forEach(col => {
    // count visible
    let n = 0;
    (state.columns[col]||[]).forEach(id => {
      const c = cardMap[id];
      if (c && visible(c)) n++;
    });
    document.getElementById("count-"+col).textContent = n;
  });
}

function updateProgress() {
  const total = CARDS.length;
  const doneVisible = (state.columns["Done"]||[]).length;
  // progress by all cards done
  const doneAll = (state.columns["Done"]||[]).length;
  const pct = total ? Math.round((doneAll/total)*100) : 0;
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressText").textContent = doneAll + " / " + total + " (" + pct + "%)";
}

// drop zones
COLUMNS.forEach(col => {
  const list = colEls[col];
  list.addEventListener("dragover", e => { e.preventDefault(); list.classList.add("drag-over"); });
  list.addEventListener("dragleave", () => list.classList.remove("drag-over"));
  list.addEventListener("drop", e => {
    e.preventDefault();
    list.classList.remove("drag-over");
    const id = e.dataTransfer.getData("text/plain");
    if (!id) return;
    // remove from all columns
    COLUMNS.forEach(c => {
      state.columns[c] = (state.columns[c]||[]).filter(x=>x!==id);
    });
    state.columns[col].push(id);
    saveState();
    render();
  });
});

trackFilter.addEventListener("change", () => { render(); });

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all card positions to defaults?")) {
    state = defaultState();
    saveState();
    render();
  }
});

// Summary list
const summaryList = document.getElementById("summaryList");
Object.entries(TRACKS).forEach(([name, info]) => {
  const li = document.createElement("li");
  li.innerHTML = `<a href="${info.file}" target="_blank">${name}</a> — ${info.file}`;
  summaryList.appendChild(li);
});

render();
</script>
